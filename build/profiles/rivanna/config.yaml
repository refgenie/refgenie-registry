# Snakemake profile for Rivanna (UVA HPC) — refgenie asset builds.
#
# Used by build/run_builds.sh:  snakemake --profile build/profiles/rivanna/
# Requires snakemake >= 8 with the SLURM executor plugin
# (snakemake-executor-plugin-slurm). Both come from the HOST snakemake pinned by
# $SNAKEMAKE_BIN, not from a crate: the driver must not run inside a container
# (see run_builds.sh). The crate the mobot job activates (databio/refgenie)
# supplies the build tools the RULES invoke, not the driver.
#
# Each rule becomes one SLURM job on the shefflab allocation. mobot dispatches
# this from a lightweight job; the heavy builds run as the SLURM jobs created
# here. Per design.md, resources come from THIS profile, not from recipes.

executor: slurm
jobs: 20                       # max concurrent SLURM jobs

# refget_store_writer: a STAGED-ROLLOUT cap, no longer a correctness measure.
#
# genome_init declares `refget_store_writer = 1` in refgenie1's Snakefile template
# (refgenie/snakefile/template/template.smk), so whatever budget appears here IS
# the number of concurrent genome_inits. Snakemake treats an undeclared custom
# resource as UNLIMITED, so omitting this key means unbounded -- verify the
# template still declares it before assuming this key does anything.
#
# History. This was 1 from 2026-07-23, as the stopgap for that morning's
# incident: four genome_inits were dispatched in the same second and athaliana
# lost the race. RefgetStore took no file lock and rewrote collections.rgci and
# aliases/collections/refgenie.tsv wholesale from the state it loaded at open
# time, so concurrent inits were last-writer-wins. athaliana's collection file
# was written but dropped from both indexes, its alias stopped resolving, and the
# nightly failed at build_fasta with "Genome 'athaliana' not found". Neither init
# reported an error.
#
# That is now fixed at the right layer. gtars takes an exclusive lock on
# <store>/.rgstore.lock, and a commit applies only the changes the writing handle
# actually made to the index it re-reads from disk under that lock (gtars
# 6a84792b) instead of overwriting from an open-time snapshot. That protects every
# writer, including the ones this Snakemake budget never touched: the gtars CLI,
# refgenie1's Python bindings, the SLURM scripts under infra/rivanna/, and
# anything run by hand. The lock is held for the commit (seconds), not for the
# whole init, so inits genuinely parallelize.
#
# So why cap it at all? Because the lock has not yet carried a real nightly. It is
# well covered by tests -- including multi-process ones that reproduce the 07-23
# incident, and a read-only cross-check against all 147 plantref collections --
# but "passes tests" and "has survived production" are different claims, and the
# failure being guarded against is silent data loss noticed hours later. 4 is
# deliberately unambitious: enough to exercise real contention on the new lock,
# few enough that a regression is bounded.
#
# REMOVE THIS KEY (restoring unlimited) once a few nightlies have run clean with
# contention actually observed -- `gtars refget lock-status <store>` shows it.
# That is the intended end state; this cap is scaffolding, not architecture. Do
# not re-lower it to 1 as a correctness measure: if 4 breaks something, the bug is
# in the lock and belongs in gtars, not here.
resources:
  refget_store_writer: 4
latency-wait: 60               # tolerate shared-FS latency on output files
rerun-incomplete: true
keep-going: true               # one failed asset must not abort the batch
printshellcmds: true
use-singularity: false         # recipes run in containers via refgenie/bulker, not snakemake

# Default SLURM resources for every rule (shefflab standard partition).
# Override per-rule below for memory-hungry indexers.
#
# History: on 2026-08-07 these were briefly raised to 16000/24000 after three
# genome_inits OOM'd at ~5 GB -- refgenie-build-fasta was calling
# load_all_sequences(), making memory scale with the whole store's sequence
# payload (7.4 GB) instead of the one genome being exported. That was fixed in
# refgenie1 (build_fasta.py loads only the target collection), so the caps came
# back down: genome_init now needs roughly one genome's bytes (~3 GB for human).
default-resources:
  slurm_account: "shefflab"
  slurm_partition: "standard"
  mem_mb: 8000
  runtime: 120                 # minutes
  cpus_per_task: 4

# Per-rule resource overrides for the heavy indexers. Rule names match the
# generated Snakefile (build_<recipe>) and the genome_init sentinel rule.
set-resources:
  genome_init:
    mem_mb: 8000
    runtime: 60
  build_star_index:
    mem_mb: 64000
    runtime: 480
  build_cellranger_reference:
    mem_mb: 64000
    runtime: 480
  build_bwa_index:
    mem_mb: 16000
    runtime: 180
  build_hisat2_index:
    mem_mb: 32000
    runtime: 240
  build_bowtie2_index:
    mem_mb: 16000
    runtime: 180
  build_salmon_index:
    mem_mb: 16000
    runtime: 180
  # gt suffixerator on a full human genome under an 8 GB memlimit uses the slow
  # external-memory path; the default 120 min runtime TIMEOUTs (yeast is fine).
  # Give it the STAR-class window. (Raising the recipe's memlimit param would let
  # it run in-memory and faster, but that's a separate recipe/catalog change.)
  build_suffixerator_index:
    mem_mb: 32000
    runtime: 480

set-threads:
  build_star_index: 8
  build_cellranger_reference: 8
  build_hisat2_index: 8
  build_bowtie2_index: 4
  build_salmon_index: 4
  build_bwa_index: 4
