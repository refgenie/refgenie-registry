# Maintainer-triggered AI re-review: comment "@RefgenieBot review" on a PR.
#
# issue_comment runs in the trusted base-repo context (secrets + write token),
# so it can run the review directly via the shared ai-review action — no
# label-event chaining (labels added with GITHUB_TOKEN never trigger other
# workflows). The review input is the artifact from the latest pr-validate
# run for the PR's current head commit.
#
# The collaborator gate (admin/write only) is what stops arbitrary fork users
# from triggering paid API calls.
name: AI Re-Review

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read

jobs:
  re-review:
    if: |
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@RefgenieBot review')
    runs-on: ubuntu-latest
    steps:
      - name: Check commenter permissions
        id: check-perms
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553  # v9.0.0
        with:
          script: |
            const { data: permission } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.payload.comment.user.login
            });
            const allowed = ['admin', 'write'].includes(permission.permission);
            core.setOutput('allowed', allowed.toString());

      - name: Acknowledge request
        if: steps.check-perms.outputs.allowed == 'true'
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553  # v9.0.0
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes'
            });

      - name: Find latest pr-validate run for this PR
        if: steps.check-perms.outputs.allowed == 'true'
        id: find-run
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553  # v9.0.0
        with:
          script: |
            const prNumber = context.payload.issue.number;
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner, repo: context.repo.repo, pull_number: prNumber,
            });
            const headSha = pr.head.sha;

            const { data: runs } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner, repo: context.repo.repo,
              workflow_id: 'pr-validate.yml', head_sha: headSha, per_page: 1,
            });
            const run = runs.workflow_runs[0];
            if (!run) {
              core.setOutput('run_id', '');
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: prNumber,
                body: ':warning: No pr-validate run found for the current head commit — ' +
                  'push a commit (or re-run pr-validate) first, then request the review again.',
              });
              return;
            }
            core.setOutput('run_id', String(run.id));
            core.setOutput('pr_number', String(prNumber));

      - name: Checkout base repo (trusted)
        if: steps.find-run.outputs.run_id != ''
        uses: actions/checkout@v7

      - name: Download validation report
        if: steps.find-run.outputs.run_id != ''
        uses: actions/download-artifact@v8
        with:
          name: pr-report
          path: pr-report-artifact
          run-id: ${{ steps.find-run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: AI review
        if: steps.find-run.outputs.run_id != ''
        uses: ./.github/actions/ai-review
        with:
          pr-number: ${{ steps.find-run.outputs.pr_number }}
          artifact-dir: pr-report-artifact
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
