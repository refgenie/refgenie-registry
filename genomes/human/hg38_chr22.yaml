name: hg38_chr22

description: |
  A small test genome, not a whole chromosome: 60 sequences (42.7 Mb) from NCBI
  GRCh38.p12 chromosome 22. One 274,643 bp sequence is named chr22; the other 59
  are RefSeq chromosome 22 scaffolds (44), alternate loci (9) and patches (6),
  named like ref|NT_167238.1|. It does not contain the full GRCh38 chr22
  (50,818,468 bp). Use it for testing only.

organism:
  scientific_name: Homo sapiens
  taxon_id: 9606

assembly:
  source: UCSC

fasta:
  sources:
    - provider: refgenie
      url: http://big.databio.org/refgenomes/hg38_chr22.fa.gz
  checksum:
    md5: 6da24cadfe7566c501da07bd54555eb2
    sha256: compute_on_registration

seqcol:
  compute: true

build:
  store: legacy
  tier: full
  drop: [star_index, tallymer_index]

metadata:
  added: 2026-05-20
  added_by: nsheff
