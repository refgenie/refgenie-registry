name: hg38_initial_masked
aliases:
  - hg38-initial-masked-ucsc

description: |
  UCSC hg38 (GRCh38), the initial 2013 release with 261 ALT haplotypes (455
  sequences), hard-masked: repeats are replaced with N. Despite the p14 file
  name, it holds no p14 patch sequences. UCSC-style names (chr1, chrM).

organism:
  scientific_name: Homo sapiens
  taxon_id: 9606

assembly:
  source: UCSC

fasta:
  sources:
    - provider: UCSC
      url: https://hgdownload.soe.ucsc.edu/goldenPath/hg38/bigZips/p14/hg38.p14.fa.masked.gz
  checksum:
    sha256: compute_on_registration

seqcol:
  digest: xEg2q8K9gV4027DMTCiaUGLCcrqySglR
  length: 455

build:
  store: jungle
  tier: store_only

