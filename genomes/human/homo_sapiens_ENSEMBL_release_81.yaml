description: |
  GRCh38 from Ensembl release 81, all 493 top-level sequences: chromosomes 1-22,
  X, Y and MT, 169 unplaced and unlocalized scaffolds, and 299 haplotype and
  patch sequences (named like CHR_HG126_PATCH). Chromosome Y is 54,106,423 bp,
  shorter than the 57,227,415 bp of other GRCh38 copies.

