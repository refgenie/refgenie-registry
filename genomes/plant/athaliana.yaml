name: athaliana
aliases:
  - arabidopsis_thaliana_COL-0_TAIR10

description: |
  Arabidopsis thaliana ecotype Col-0 reference assembly TAIR10, sourced from
  TAIR / Ensembl Plants.

organism:
  scientific_name: Arabidopsis thaliana
  taxon_id: 3702

assembly:
  source: Ensembl
  accession: GCA_000001735.1
  level: chromosome

fasta:
  checksum:
    sha256: compute_on_registration

seqcol:
  compute: true

build:
  store: plantcore
  tier: standard
  add: [suffixerator_index]
  drop: [star_index]

metadata:
  added: 2026-08-11
  added_by: nsheff
