pep_version: 2.1.0
sample_table: sources.csv
sample_table_index: pep_sample_name

# Root for relative fasta paths in sources.csv ($REFGETSTORE_FASTA set by env.sh).
# Shared with plantsup. The folder keeps the old plantref name.
fasta_root: $REFGETSTORE_FASTA/plantref

# Published: the nightly declares this store to the build catalog
# (refgenie store apply) and the catalog export carries it to api.refgenie.org.
publish:
  priority: 50
  description: Well-assembled plant, algal and model-organism reference genomes
