pep_version: 2.1.0
sample_table: sources.csv
sample_table_index: fasta

# Excluded from the nightly. This store has never been built, so without this key
# sync_stores.py --changed reports it every run and the nightly would attempt a
# cold build of all 314 transcriptomes.
#
# Deliberately not solved with a .sources.sha256 stamp: a stamp asserts "the built
# store matches this sources.csv", which is untrue for a store that was never
# built, and it would go stale as soon as sources.csv changed, silently pulling
# the store back into the build loop.
#
# To turn it on: delete this key, build the store once by hand
# (`python build.py salmon_txomes`), then `sync_stores.py --record salmon_txomes`.
nightly: false
